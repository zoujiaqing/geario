name: Linux runtime comparison

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [compare, diagnose, diagnose64, verify]
        default: compare
      baseline:
        description: Commit to compare against in verify mode
        type: string
        default: 4a06cd04123f31c83f69c8510f7242716bf1e7ec
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-benchmark.yml'
      - 'bench-runtime/**'

permissions:
  contents: read

jobs:
  echo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux diagnostics
        if: inputs.mode == 'diagnose' || inputs.mode == 'diagnose64'
        run: |
          sudo apt-get update -qq
          if apt-cache show linux-perf >/dev/null 2>&1; then
            sudo apt-get install -y strace linux-perf
          else
            sudo apt-get install -y strace linux-tools-common linux-tools-generic
          fi
          for bin in /usr/bin/perf $(find /usr/lib/linux-tools /usr/libexec -name perf 2>/dev/null || true); do
            if test -x "$bin" && sudo "$bin" stat -e task-clock -- true >/dev/null 2>&1; then
              echo "BENCH_PERF=$bin" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Compare geario and Tokio over TCP loopback
        env:
          BENCH_MODE: ${{ inputs.mode || 'compare' }}
          BENCH_BASE_REF: ${{ inputs.baseline }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited 2>/dev/null || true
          bash bench-runtime/compare.sh "$RUNNER_TEMP/runtime-benchmark"
          reference=tokio
          if [ "$BENCH_MODE" = verify ]; then reference=base; fi
          if [[ "$BENCH_MODE" == diagnose* ]]; then reference=uring; fi
          python3 bench-runtime/summarize.py "$RUNNER_TEMP/runtime-benchmark" \
            --reference "$reference" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-runtime-comparison
          path: |
            ${{ runner.temp }}/runtime-benchmark/*.txt
            ${{ runner.temp }}/runtime-benchmark/*.log
            ${{ runner.temp }}/runtime-benchmark/*.sha256
