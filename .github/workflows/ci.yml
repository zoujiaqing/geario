name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Flaky tests only show up over repeated runs, and repeating a run has to
  # not require an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: test geario
        run: cargo test -p geario --features rustls

      # The poller is forked, and the change lives in its epoll backend, so
      # its own tests have to run on Linux and not only on the machine that
      # happens to be handy.
      - name: test geario-polling
        run: cargo test -p geario-polling

      - name: test geario-macros
        run: cargo test -p geario-macros

  drivers:
    name: driver (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [neon-polling, neon-uring]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux picks io_uring when it is available and falls back to polling,
      # so "which one ran" is not obvious from a plain test run. Both are
      # named here: the two drivers have had different bugs, and the io_uring
      # one had two that only a real socket under load could find.
      # An io_uring ring pins memory, and the test harness runs one
      # runtime per thread, so the default locked-memory limit runs out
      # and the ring cannot be created. A server creates one per worker
      # and never gets near it; raising the limit is what an io_uring
      # deployment does anyway.
      - name: test with the driver forced
        run: |
          ulimit -l unlimited 2>/dev/null || ulimit -l 1048576 2>/dev/null || true
          echo "memlock limit: $(ulimit -l)"
          cargo test -p geario --features "rustls,${{ matrix.driver }}"

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A feature that only compiles when another one happens to be on is a
      # trap for whoever turns it on next. Every combination that a user can
      # ask for has to build on its own.
      - name: check
        run: |
          set -e
          for f in "" "trace" "rustls" "rustls-ring" "simd" \
                   "neon-polling" "neon-uring" "neon-polling,neon-uring" \
                   "neon-polling,rustls" "neon-uring,rustls,trace,simd"; do
            echo "--- features: ${f:-default} ---"
            if [ -z "$f" ]; then
              cargo check -p geario --all-targets
            else
              cargo check -p geario --all-targets --features "$f"
            fi
          done

  # The feature matrix on Linux cannot see a driver choice that is
  # unsatisfiable on another platform, and asking for io_uring on macOS is
  # exactly that.
  features-macos:
    name: feature combinations (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: |
          set -e
          for f in "rustls" "neon-polling" "neon-uring" "neon-polling,neon-uring"; do
            echo "--- features: $f ---"
            cargo check -p geario --all-targets --features "$f"
          done

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
