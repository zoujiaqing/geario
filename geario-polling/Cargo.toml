[package]
name = "geario-polling"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Portable interface to epoll, kqueue, event ports, and IOCP, for geario"
keywords = ["epoll", "kqueue", "iocp", "io"]
categories = ["asynchronous", "network-programming", "os"]
authors.workspace = true
repository.workspace = true
license.workspace = true
exclude = ["/.*"]

[lib]
name = "geario_polling"
path = "src/lib.rs"

[dependencies]
cfg-if = "1"

[dependencies.tracing]
version = "0.1.37"
default-features = false
optional = true

[target.'cfg(any(unix, target_os = "fuchsia", target_os = "vxworks"))'.dependencies.rustix]
version = "1.0.5"
features = ["event", "fs", "pipe", "process", "std", "time"]
default-features = false

[target.'cfg(windows)'.dependencies]
concurrent-queue = "2.2.0"
pin-project-lite = "0.2.9"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.60"
features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]

[target.'cfg(target_os = "hermit")'.dependencies.hermit-abi]
version = "0.5.0"

[dev-dependencies]
easy-parallel = "3.1.0"
fastrand = "2.0.0"
socket2 = "0.6.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os="vita")))'.dev-dependencies]
signal-hook = "0.3.17"
