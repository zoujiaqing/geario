[workspace]
resolver = "2"
members = ["geario", "geario-macros"]
exclude = ["bench-echo"]

[workspace.package]
authors = ["zoujiaqing <zoujiaqing@gmail.com>"]
repository = "https://github.com/zoujiaqing/geario"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
async_fn_in_trait = { level = "allow", priority = -1 }
unknown_lints = { level = "allow", priority = -1 }
rust_2018_idioms = "deny"
warnings = "deny"
missing_debug_implementations = "deny"
unexpected_cfgs = { level = "warn", priority = -2, check-cfg = ['cfg(docsrs_dep)'] }

[workspace.dependencies]
geario = { path = "geario" }
geario-macros = { path = "geario-macros" }

ntex-polling = "3.10.0"
ntex-io-uring = "0.7.120"

async-channel = "2"
async-task = "4.5.0"
atomic-waker = "1.1"
backtrace = "0.3.76"
bitflags = "2"
bytes = "1.11.0"
cfg-if = "1.0.0"
core_affinity = "0.8"
crossbeam-channel = "0.5.8"
crossbeam-queue = "0.3.8"
ctrlc = "3.4"
env_logger = { version = "0.11", default-features = false }
foldhash = "0.2.0"
http = "1.5.0"
# rustls only: OpenSSL would need per-platform headers and libraries for
# every Kotlin/Native target, which is the whole reason to avoid it here.
tls_rustls = { version = "0.23", package = "rustls", default-features = false }
rustls-pemfile = "2"
webpki-roots = "1.0"
futures-core = { version = "0.3.33", default-features = false, features = ["alloc"] }
futures-timer = "3.0"
hashbrown = { version = "0.17.1", features = ["serde"] }
libc = "0.2.189"
log = "0.4"
nix = "0.31.3"
oneshot = { version = "0.2.1", features = ["std", "async"] }
parking_lot = "0.12.5"
pin-project-lite = "0.2"
proc-macro2 = "1.0.105"
quote = "1.0.43"
scoped-tls = "1.0.1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4.4"
simdutf8 = "0.1.5"
slab = "0.4.9"
socket2 = "0.6.1"
swap-buffer-queue = "0.2.1"
syn = "3.0"
thiserror = "2"
tok-io = { version = "1", package = "tokio", default-features = false }
uuid = { version = "1.19", features = ["v7"] }
windows-sys = "0.61.0"

compio-buf = "0.8.0"
compio-io = "0.9.0"
compio-net = "0.11.0"
compio-driver = "0.11.1"
compio-runtime = "0.11.0"

criterion = "0.5"
derive_more = "2.0.1"
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
rand = "0.9"
rcgen = "0.13"
serde_json = "1"
serde_test = "1.0"
